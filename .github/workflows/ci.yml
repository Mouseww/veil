name: ci
on:
  push:
    branches: [master, main, feature/**]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: ui tests and build
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - name: cargo test
        env:
          VEIL_SKIP_UI_BUILD: "1"
        run: cargo test --workspace
      - name: plugin tests
        run: node --test plugin/claude-code/scripts/veil.test.mjs
