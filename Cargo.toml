[workspace]
resolver = "2"
members = ["crates/dgw-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
regex = "1"
fancy-regex = "0.19"
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
http = "1"
